name: Web demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Pages (requires Pages enabled)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 and web templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/web-export build/web
          base=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -j /tmp/templates.zip templates/web_nothreads_release.zip templates/web_nothreads_debug.zip -d tmp/web-export
      - name: Import and export
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: eternal-keeper-web
          path: build/web
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.event.repository.private == false || inputs.publish == true
        with:
          path: build/web

  deploy:
    if: github.event.repository.private == false || inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
