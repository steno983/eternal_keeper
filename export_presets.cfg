[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/**/*.json,assets/**/*.json"
exclude_filter="tests/*,tools/*,docs/*,tmp/*,build/*,artifacts/*,Nuova cartella/*,assets/animation_v2/*,assets/animation_v3/*,assets/animation_v4/*,assets/*_skin/*"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]

custom_template/debug="res://tmp/web-export/web_nothreads_debug.zip"
custom_template/release="res://tmp/web-export/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/mobile-shell.html"
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
